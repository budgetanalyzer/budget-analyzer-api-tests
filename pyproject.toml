[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-analyzer-api-tests"
version = "0.1.0"
description = "Black-box API tests for the Budget Analyzer public gateway API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28.1,<0.29",
  "jsonschema[format-nongpl]>=4.26.0,<5",
  "playwright>=1.63.0,<2",
  "pydantic>=2.14.0,<3",
  "PyYAML>=6.0.3,<7",
  "pytest>=9.1.1,<10",
  "referencing>=0.37.0,<0.38",
]

[dependency-groups]
build = [
  "setuptools>=84.0.0,<85",
]
dev = [
  { include-group = "build" },
  "mypy>=2.4.0,<3",
  "ruff>=0.17.0,<0.18",
  "types-PyYAML>=6.0.12.20260906,<7",
]

[tool.dependency-contract]
# renovate: datasource=pypi depName=uv
uv = "0.13.5"
# renovate: datasource=pypi depName=pip-audit
pip-audit = "2.10.1"

[tool.uv]
default-groups = ["dev"]
no-build-isolation-package = ["budget-analyzer-api-tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api_tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".ai-session-handler"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = [
  "openapi(operation_id, contract='unified'): associate a test with a namespaced OpenAPI operation id",
  "forbidden_response(operation_id): provide executable unified-contract HTTP 403 evidence",
  "session_gateway_case(case_id): associate a test with an exact Session Gateway inventory case",
  "gateway_routing: test a public gateway route or method boundary outside OpenAPI operations",
  "placeholder: marker-only placeholder for planned endpoint coverage",
  "mutation: test may create or update API resources",
  "destructive: test may delete, hide, import, or otherwise destructively alter API resources",
  "readonly: test only reads API resources",
  "authentication: test verifies missing or invalid authentication behavior",
  "authorization: test verifies authorization or resource isolation behavior",
  "production_safe: test is allowed to run against production defaults",
  "auth_smoke: focused live browser/session integration smoke test",
  "secondary_auth_smoke: focused live secondary-browser/session integration smoke test",
  "admin: scenarios that require the validated reusable admin identity",
  "admin_auth_smoke: reusable admin authentication, role, and permission smoke",
  "admin_deactivation: exact-local disposable-user deactivation and public revocation lifecycle",
]
