name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Synchronize frozen dependency graph
        env:
          PYTHONPATH: src
        run: python -m api_tests.local_bootstrap

      - name: Verify dependency contract and exact environment parity
        env:
          PYTHONPATH: src
        run: .venv/bin/python tools/check-dependency-contract.py

      - name: Run deterministic unit tests
        run: .venv/bin/python -m pytest tests/unit --env local

      - name: Collect local API suite without network access
        run: .venv/bin/python -m pytest tests/api --env local --collect-only

      - name: Collect production-safe API suite without credentials
        run: >-
          .venv/bin/python -m pytest tests/api --env production
          -m "readonly and production_safe" --collect-only

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check .

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Type check
        run: .venv/bin/python -m mypy src tests
