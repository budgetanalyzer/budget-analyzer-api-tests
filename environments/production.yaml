name: production
origin: https://demo.budgetanalyzer.org
api_base_path: /api
openapi_path: /api-docs/openapi.json
environment_type: production
allow_mutation: false
allow_destructive: false
session_cookie_name: BA_SESSION
auth:
  mode: supplied_sessions
  supplied_sessions:
    primary_session_env: BA_PRIMARY_SESSION
    secondary_session_env:
    admin_session_env:
  browser:
browser_auth_contract:
  callback_path: /login/oauth2/code/idp
  default_return_path: /
  admin_return_path: /admin
  logout_return_path: /peace
  provider_logout_path: /v2/logout
  provider_host_suffixes:
    - auth0.com
    - auth.budgetanalyzer.org
  session_cookie_same_site: Strict
timeouts:
  request_seconds: 15
  eventually_seconds: 30
